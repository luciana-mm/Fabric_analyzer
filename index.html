<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fabric Analyzer - Monitoramento</title>
    <style>
        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
        }

        .container {
            width: min(100%, 1200px);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 24px 80px rgba(15, 23, 42, 0.25);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            background: rgba(30, 41, 59, 0.85);
            color: #f8fafc;
            outline: none;
            font-size: 1rem;
            box-sizing: border-box;
        }

        button {
            padding: 12px 18px;
            border-radius: 12px;
            border: none;
            background: #2563eb;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        .streams-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .streams-grid {
                grid-template-columns: 1fr;
            }
        }

        .stream-box {
            border-radius: 18px;
            overflow: hidden;
            background: #000;
            min-height: 300px;
            display: flex;
            flex-direction: column;
        }

        .stream-title {
            background: #1e293b;
            padding: 10px 16px;
            margin: 0;
            font-size: 0.9rem;
            font-weight: 600;
            color: #cbd5e1;
            text-align: center;
            border-bottom: 1px solid #334155;
        }

        .stream-box img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
        }

        .footer {
            font-size: 0.95rem;
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>Fabric Analyzer</h1>
            <p>Monitoramento de tecidos: Detecção de falhas e visão Grayscale (tons de cinza).</p>

            <div class="input-group">
                <label for="baseUrl">IP e Porta do Servidor (Proxy)</label>
                <input id="baseUrl" type="text" value="http://127.0.0.1:8090" placeholder="Ex: http://127.0.0.1:8090" />
            </div>

            <div style="display:flex; gap:12px; flex-wrap:wrap;">
                <button id="loadButton">Conectar Câmeras</button>
            </div>
        </div>

        <div class="streams-grid">
            <!-- Câmera 1: Análise do OpenCV (Linhas Vermelhas) -->
            <div class="card stream-box" style="padding: 0;">
                <h3 class="stream-title">Análise de Falhas (Linhas)</h3>
                <img id="analyzedStream" alt="Stream analisado" src="http://127.0.0.1:8090/stream-analyzed.mjpg" />
            </div>

            <!-- Câmera 2: Visão em Tons de Cinza -->
            <div class="card stream-box" style="padding: 0;">
                <h3 class="stream-title">Visão Grayscale</h3>
                <img id="grayStream" alt="Stream cinza" src="http://127.0.0.1:8090/stream-grayscale.mjpg" />
            </div>
        </div>
        <div class="card"
            style="display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;">
            <div>
                <div style="font-size:0.85rem; color:#94a3b8;">Falhas contadas</div>
                <div id="defectCount" style="font-size:2.2rem; font-weight:700; color:#f97316;">0</div>
            </div>
            <button id="resetButton" style="background:#dc2626;">Zerar contagem</button>
        </div>

        <div class="card footer">
            <p>Se as imagens não carregarem, verifique se o script <code>server.py</code> está rodando com as novas
                rotas.</p>
        </div>
    </div>

    <script>
        const baseUrlInput = document.getElementById("baseUrl");
        const analyzedStream = document.getElementById("analyzedStream");
        const grayStream = document.getElementById("grayStream");
        const loadButton = document.getElementById("loadButton");

        function loadStreams() {
            const baseUrl = baseUrlInput.value.trim().replace(/\/$/, "");
            if (!baseUrl) return;

            const timestamp = Date.now();

            analyzedStream.src = `${baseUrl}/stream-analyzed.mjpg?_t=${timestamp}`;
            grayStream.src = `${baseUrl}/stream-grayscale.mjpg?_t=${timestamp}`;
        }

        loadButton.addEventListener("click", loadStreams);

        baseUrlInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                event.preventDefault();
                loadStreams();
            }
        });
        const defectCountEl = document.getElementById("defectCount");
        const resetButton = document.getElementById("resetButton");
        let pollInterval = null;

        async function fetchDefectCount() {
            const baseUrl = baseUrlInput.value.trim().replace(/\/$/, "");
            if (!baseUrl) return;
            try {
                const res = await fetch(`${baseUrl}/defect-count`);
                const data = await res.json();
                defectCountEl.textContent = data.count;
            } catch (err) {
                console.error("Erro ao buscar contagem:", err);
            }
        }

        async function resetCount() {
            const baseUrl = baseUrlInput.value.trim().replace(/\/$/, "");
            if (!baseUrl) return;
            try {
                const res = await fetch(`${baseUrl}/reset-count`, { method: "POST" });
                const data = await res.json();
                defectCountEl.textContent = data.count;
            } catch (err) {
                console.error("Erro ao resetar contagem:", err);
            }
        }

        resetButton.addEventListener("click", resetCount);

        function startPolling() {
            if (pollInterval) clearInterval(pollInterval);
            fetchDefectCount();
            pollInterval = setInterval(fetchDefectCount, 1000);
        }
        function loadStreams() {
            const baseUrl = baseUrlInput.value.trim().replace(/\/$/, "");
            if (!baseUrl) return;

            const timestamp = Date.now();

            analyzedStream.src = `${baseUrl}/stream-analyzed.mjpg?_t=${timestamp}`;
            grayStream.src = `${baseUrl}/stream-grayscale.mjpg?_t=${timestamp}`;
            startPolling(); // <-- adicionado
        }
    </script>
</body>

</html>
